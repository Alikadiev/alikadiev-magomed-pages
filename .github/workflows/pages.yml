name: Deploy compiled website to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  prepare:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore and verify compiled website
        run: |
          cat site-build.part-* > site-build.tar.gz
          sha256sum --check site-build.sha256
          mkdir _site
          tar -xzf site-build.tar.gz -C _site
          sha256sum --check site-update.sha256
          tar -xzf site-update.tar.gz -C _site
          test -f _site/projects/sadovye-kashpo/index.html
          sha256sum --check grot-update.sha256
          tar -xzf grot-update.tar.gz -C _site
          test -f _site/projects/skalny-domik-grot/index.html
          sha256sum --check gallery-update.sha256
          tar -xzf gallery-update.tar.gz -C _site
          sha256sum --check painting-color-update.sha256
          tar -xzf painting-color-update.tar.gz -C _site
          sha256sum --check painting-depth-update.sha256
          tar -xzf painting-depth-update.tar.gz -C _site
          sha256sum --check waterfall-524-update.sha256
          tar -xzf waterfall-524-update.tar.gz -C _site
          test -f _site/paintings/vodopad-524/index.html
          sha256sum --check painting-card-details-update.sha256
          tar -xzf painting-card-details-update.tar.gz -C _site
          sha256sum --check painting-serif-update.sha256
          tar -xzf painting-serif-update.tar.gz -C _site
          sha256sum --check painting-cormorant-update.sha256
          tar -xzf painting-cormorant-update.tar.gz -C _site
          cat paintings-replacement-update.part-* > paintings-replacement-update.tar.gz
          sha256sum --check paintings-replacement-update.sha256
          rm -rf _site/paintings _site/images/paintings
          tar -xzf paintings-replacement-update.tar.gz -C _site
          test -f _site/paintings/zakat-525/index.html
          test -f _site/paintings/akhmedkent/index.html
          test ! -e _site/paintings/rabota-01
          test ! -e _site/images/paintings/painting-1.png
          sha256sum --check painting-compact-update.sha256
          tar -xzf painting-compact-update.tar.gz -C _site
          test -f _site/paintings/index.html
          sha256sum --check heading-wrap-update.sha256
          tar -xzf heading-wrap-update.tar.gz -C _site
          test -f _site/paintings/index.html
          cat free-copies-update.part-* > free-copies-update.tar.gz
          sha256sum --check free-copies-update.sha256
          tar -xzf free-copies-update.tar.gz -C _site
          test -f _site/paintings/tanets-sredi-mechey-512/index.html
          test -f _site/paintings/buket-v-siney-vaze-kopiya/index.html
          cat grot-photos-update.part-* > grot-photos-update.tar.gz
          sha256sum --check grot-photos-update.sha256
          rm -rf _site/images/projects/skalny-domik-grot
          tar -xzf grot-photos-update.tar.gz -C _site
          test -f _site/images/projects/skalny-domik-grot/grot-01.jpeg
          test -f _site/images/projects/skalny-domik-grot/grot-17.jpeg
          test ! -e _site/images/projects/skalny-domik-grot/IMG_20260915_202439.jpg
          cat grot-recalc-update.part-* > grot-recalc-update.tar.gz
          sha256sum --check grot-recalc-update.sha256
          rm -rf _site/images/projects/skalny-domik-grot
          tar -xzf grot-recalc-update.tar.gz -C _site
          test -f _site/images/projects/skalny-domik-grot/grot-recalc-01.jpg
          test -f _site/images/projects/skalny-domik-grot/grot-recalc-17.jpeg
          test ! -e _site/images/projects/skalny-domik-grot/grot-01.jpeg
          cat spring-study-update.part-* > spring-study-update.tar.gz
          sha256sum --check spring-study-update.sha256
          tar -xzf spring-study-update.tar.gz -C _site
          test -f _site/paintings/predchuvstvie-vesny-000/index.html
          test -f _site/images/paintings/predchuvstvie-vesny-000-framed.png
          sha256sum --check grot-specs-update.sha256
          tar -xzf grot-specs-update.tar.gz -C _site
          test -f _site/projects/skalny-domik-grot/index.html
          sha256sum --check about-biography-update.sha256
          tar -xzf about-biography-update.tar.gz -C _site
          test -f _site/about/index.html
          sha256sum --check about-review-update.sha256
          tar -xzf about-review-update.tar.gz -C _site
          test -f _site/about/index.html
          sha256sum --check about-wiki-update.sha256
          tar -xzf about-wiki-update.tar.gz -C _site
          test -f _site/about/index.html
          sha256sum --check about-hero-update.sha256
          tar -xzf about-hero-update.tar.gz -C _site
          test -f _site/about/index.html
          sha256sum --check about-birth-update.sha256
          tar -xzf about-birth-update.tar.gz -C _site
          test -f _site/about/index.html
          sha256sum --check about-name-update.sha256
          tar -xzf about-name-update.tar.gz -C _site
          test -f _site/about/index.html
          sha256sum --check grot-extra-update.sha256
          tar -xzf grot-extra-update.tar.gz -C _site
          sha256sum --check grot-extra-assets.sha256
          cp grot-extra-assets/* _site/images/projects/skalny-domik-grot/
          test -f _site/images/projects/skalny-domik-grot/grot-extra-12.jpeg
          test -f _site/projects/skalny-domik-grot/index.html
          sha256sum --check six-studies-update.sha256
          tar -xzf six-studies-update.tar.gz -C _site
          sha256sum --check author-studies-assets.sha256
          cp author-studies-assets/* _site/images/paintings/
          test -f _site/paintings/k-oseni-119/index.html
          test -f _site/paintings/seryy-den-249/index.html
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
