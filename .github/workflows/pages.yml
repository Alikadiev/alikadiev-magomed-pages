name: Deploy compiled website to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  prepare:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore and verify compiled website
        run: |
          cat site-build.part-* > site-build.tar.gz
          sha256sum --check site-build.sha256
          mkdir _site
          tar -xzf site-build.tar.gz -C _site
          sha256sum --check site-update.sha256
          tar -xzf site-update.tar.gz -C _site
          test -f _site/projects/sadovye-kashpo/index.html
          sha256sum --check grot-update.sha256
          tar -xzf grot-update.tar.gz -C _site
          test -f _site/projects/skalny-domik-grot/index.html
          sha256sum --check gallery-update.sha256
          tar -xzf gallery-update.tar.gz -C _site
          sha256sum --check stone-update.sha256
          tar -xzf stone-update.tar.gz -C _site
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
